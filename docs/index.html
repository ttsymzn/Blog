  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;

      --muted: #6b6b6b;
      --line: #e3e1dc;
      --accent: #2f6f8f;

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;

        --muted: #a3a09b;

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

    }
    a { color: var(--accent); }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;

    h2.heading {
      font-size: 1rem;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    /* 一覧：PCは「最新記事｜月別アーカイブ」の2カラム、スマホは縦に並べる */
    .list-view {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 32px;
      align-items: start;
    }
    .archive-col { position: sticky; top: 16px; }
    @media (max-width: 820px) {
      .list-view { grid-template-columns: minmax(0, 1fr); }
      .archive-col { position: static; }
    }

    .cards { display: grid; gap: 16px; }
    .card {
      position: relative;
      display: flex;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card img {
      flex: 0 0 180px;
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--line);
    }
    .card-body { min-width: 0; }
    .card h3 { margin: 0 0 4px; font-size: 1.1rem; line-height: 1.5; }
    .card h3 a { color: inherit; text-decoration: none; }
    /* タイトルのリンクをカード全体に広げて、どこを押しても記事が開くようにする */
    .card h3 a::after { content: ""; position: absolute; inset: 0; }
    .card .excerpt {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .card .more {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin-top: 4px;
      font-size: .9rem;
    }
    .date { color: var(--muted); font-size: .85rem; }
    @media (max-width: 560px) {
      .card { flex-direction: column; padding: 12px; }
      .card img { flex-basis: auto; width: 100%; height: auto; aspect-ratio: 16 / 9; }
    }

    .archive details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .archive summary {

    .archive ul { list-style: none; margin: 0; padding: 0 12px 8px; }
    .archive li { padding: 4px 0; border-top: 1px dashed var(--line); font-size: .92rem; }
    .archive li .date { margin-right: .5em; }

    /* 記事ページ */
    .post {
      max-width: 760px;

    .post .post-title { font-size: 1.5rem; line-height: 1.4; margin: 4px 0 20px; }
    .post-body { overflow-wrap: anywhere; }
    .post-body img, .post-body video { max-width: 100%; height: auto; }

    /* 記事の写真をクリックしたときに、ページの上に大きく表示する */

    [hidden] { display: none !important; }

  <noscript>
    <p class="status">蘇南高校 校長ブログの記事は<a href="https://70sonan.blogspot.com/">こちら</a>からご覧いただけます。</p>

  <script>
    (function () {
      // 表示するブログと、トップに並べる最新記事の数
      var BLOG_URL = 'https://70sonan.blogspot.com';
      var LATEST_COUNT = 5;
      var PREVIEW_LINES = 3;
      var PAGE_SIZE = 150;
      var SITE_TITLE = document.title;

      var posts = [];
      var byId = {};
      var byUrl = {};
      var listScrollY = 0;

      var $ = function (id) { return document.getElementById(id); };

      // Blogger のフィードは JSONP で読み込む（別ドメインでも取得できる）
      var jsonpCount = 0;
      function jsonp(path, params) {
        return new Promise(function (resolve, reject) {
          var cb = '__blogFeed' + (jsonpCount++) + '_' + Date.now();
          var script = document.createElement('script');
          var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 15000);
          function cleanup() {
            clearTimeout(timer);
            delete window[cb];
            script.remove();
          }
          window[cb] = function (data) { cleanup(); resolve(data); };
          script.onerror = function () { cleanup(); reject(new Error('load error')); };
          script.src = BLOG_URL + path + '?alt=json-in-script' + (params || '') + '&callback=' + cb;
          document.head.appendChild(script);
        });
      }

      // 一覧用：本文を含まない要約フィードで全記事を集める（データが軽い）
      function fetchAllSummaries(startIndex, acc) {
        return jsonp('/feeds/posts/summary', '&start-index=' + startIndex + '&max-results=' + PAGE_SIZE).then(function (data) {
          var entries = data.feed.entry || [];
          acc = acc.concat(entries);
          return entries.length < PAGE_SIZE ? acc : fetchAllSummaries(startIndex + PAGE_SIZE, acc);
        });
      }

      // トップのカード用：最新記事だけ本文ごと取得する
      function fetchLatestFull() {
        return jsonp('/feeds/posts/default', '&max-results=' + LATEST_COUNT).then(function (data) {
          return data.feed.entry || [];
        });
      }

      // 記事を開いたとき：その1件だけ本文を取得する
      function fetchPostBody(id) {
        return jsonp('/feeds/posts/default/' + id).then(function (data) {
          return data.entry;
        });
      }

      function toPost(entry) {
        var alt = (entry.link || []).filter(function (l) { return l.rel === 'alternate'; })[0];
        var thumb = entry.media$thumbnail && entry.media$thumbnail.url;
        if (thumb) {
          // Blogger のサムネイルは 72px なので大きいサイズに差し替える
          thumb = thumb.replace(/\/s72(-[a-z]+)*\//, '/w640-h360-c/').replace(/=s72(-[a-z]+)*$/, '=w640-h360-c');
        }
        return {
          id: entry.id.$t.split('post-').pop(),
          title: (entry.title && entry.title.$t) || '（無題）',
          published: entry.published.$t,
          time: Date.parse(entry.published.$t),
          jst: toJstDate(entry.published.$t),
          html: null,
          lines: [((entry.summary || {}).$t || '').replace(/\s+/g, ' ').trim()].filter(Boolean),
          thumb: thumb || '',
          url: alt ? alt.href : BLOG_URL
        };
      }

      // 本文を含むエントリーから本文・行ごとのテキスト・サムネイルを記事に入れる
      function setBody(p, entry) {
        var html = (entry.content || entry.summary || {}).$t || '';
        var doc = new DOMParser().parseFromString(html, 'text/html');
        if (!p.thumb) {
          var img = doc.querySelector('img');
          var src = img && img.getAttribute('src');
          if (src) p.thumb = src.replace(/\/s72(-[a-z]+)*\//, '/w640-h360-c/').replace(/=s72(-[a-z]+)*$/, '=w640-h360-c');
        }
        p.html = html;
        p.lines = toLines(doc);
      }

      // 本文を改行を保ったまま行ごとのテキストにする（空行は除く）
      function toLines(doc) {
        var body = doc.body;
        body.querySelectorAll('script, style').forEach(function (n) { n.remove(); });
        body.querySelectorAll('br').forEach(function (br) { br.replaceWith('\n'); });
        body.querySelectorAll('p, div, li, h1, h2, h3, h4, h5, h6, blockquote, tr').forEach(function (n) {
          n.appendChild(doc.createTextNode('\n'));
        });
        return (body.textContent || '').split('\n').map(function (line) {
          return line.replace(/\s+/g, ' ').trim();
        }).filter(Boolean);
      }

      // Blogger のフィードの日時は太平洋時間（-07:00 など）なので、日本時間の日付（YYYY-MM-DD）に直す
      function toJstDate(iso) {
        return new Date(Date.parse(iso) + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      }

      function formatDate(ymd) {
        return ymd.slice(0, 4) + '年' + Number(ymd.slice(5, 7)) + '月' + Number(ymd.slice(8, 10)) + '日';
      }

      function el(tag, props, children) {
        var node = document.createElement(tag);
        Object.keys(props || {}).forEach(function (k) { node[k] = props[k]; });
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
      }

      function renderList() {
        var latest = $('latest');
        latest.textContent = '';
        posts.slice(0, LATEST_COUNT).forEach(function (p) {
          var img = p.thumb ? el('img', { src: p.thumb, alt: '', loading: 'lazy' }) : null;
          var more = el('a', { className: 'more', href: '#post-' + p.id, textContent: '続きはこちら' });
          more.dataset.hasMoreLines = p.lines.length > PREVIEW_LINES ? '1' : '';
          latest.appendChild(el('article', { className: 'card' }, [
            img,
            el('div', { className: 'card-body' }, [
              el('div', { className: 'date', textContent: formatDate(p.jst) }),
              el('h3', {}, [el('a', { href: '#post-' + p.id, textContent: p.title })]),
              el('p', { className: 'excerpt', textContent: p.lines.slice(0, PREVIEW_LINES).join('\n') }),
              more
            ])
          ]));
        });

        // 6件目以降を月ごとにまとめる
        var archive = $('archive');
        archive.textContent = '';
        var months = [];
        var groups = {};
        posts.slice(LATEST_COUNT).forEach(function (p) {
          var key = p.jst.slice(0, 7);
          if (!groups[key]) { groups[key] = []; months.push(key); }
          groups[key].push(p);
        });
        if (!months.length) {
          archive.appendChild(el('p', { className: 'date', textContent: 'まだありません' }));
        }
        months.forEach(function (key) {
          var label = key.slice(0, 4) + '年' + Number(key.slice(5, 7)) + '月';
          var items = groups[key].map(function (p) {
            return el('li', {}, [
              el('span', { className: 'date', textContent: Number(p.jst.slice(8, 10)) + '日' }),
              el('a', { href: '#post-' + p.id, textContent: p.title })
            ]);
          });
          archive.appendChild(el('details', {}, [
            el('summary', {}, [
              document.createTextNode(label + ' '),
              el('span', { textContent: '(' + items.length + ')' })
            ]),
            el('ul', {}, items)
          ]));
        });
      }

      // 3行を超える記事（1行が長くて折り返しで3行を超える場合も）に「続きはこちら」を出す
      function updateMoreLinks() {
        document.querySelectorAll('#latest .card').forEach(function (card) {
          var excerpt = card.querySelector('.excerpt');
          var more = card.querySelector('.more');
          more.hidden = !(more.dataset.hasMoreLines || excerpt.scrollHeight > excerpt.clientHeight + 1);
        });
      }

      function showPost(p) {
        $('post-date').textContent = formatDate(p.jst);
        $('post-title').textContent = p.title;
        $('post-original').href = p.url;
        if (p.html !== null) {
          $('post-body').innerHTML = p.html;
        } else {
          // 本文はまだ取得していないので、この記事の分だけ取りに行く
          $('post-body').textContent = '読み込み中…';
          fetchPostBody(p.id).then(function (entry) {
            setBody(p, entry);
            if (location.hash === '#post-' + p.id) $('post-body').innerHTML = p.html;
          }).catch(function () {
            if (location.hash !== '#post-' + p.id) return;
            $('post-body').textContent = '本文を読み込めませんでした。';
            $('post-body').appendChild(el('a', { href: p.url, textContent: 'Bloggerで見る' }));
          });
        }
        document.title = p.title + '｜蘇南高校 校長ブログ';
        $('list-view').hidden = true;
        $('post-view').hidden = false;
        window.scrollTo(0, 0);
      }

      function showList() {
        document.title = SITE_TITLE;
        $('post-view').hidden = true;
        $('list-view').hidden = false;
        updateMoreLinks();
        window.scrollTo(0, listScrollY);
      }

      function route() {
        var m = location.hash.match(/^#post-(\d+)$/);
        if (m && byId[m[1]]) {
          showPost(byId[m[1]]);
        } else {
          showList();
        }
      }

      // 記事の写真は別ページで開かず、このページの上に大きく表示する
      var lightboxOpener = null;

      function isImageLink(a) {
        return a.closest('#post-body') && a.querySelector('img') &&
          /(googleusercontent\.com|bp\.blogspot\.com)\/|\.(jpe?g|png|gif|webp)([?#]|$)/i.test(a.href);
      }

      function openLightbox(a) {
        var thumb = a.querySelector('img');
        $('lightbox-img').src = a.href;
        $('lightbox-img').alt = thumb.alt || '';
        $('lightbox').hidden = false;
        document.body.classList.add('lightbox-open');
        lightboxOpener = a;
        // スマホの「戻る」でも写真だけ閉じられるよう、履歴を1つ積んでおく
        history.pushState({ lightbox: true }, '');
        $('lightbox-close').focus();
      }

      function hideLightbox() {
        if ($('lightbox').hidden) return;
        $('lightbox').hidden = true;
        $('lightbox-img').removeAttribute('src');
        document.body.classList.remove('lightbox-open');
        if (lightboxOpener) lightboxOpener.focus({ preventScroll: true });
        lightboxOpener = null;
      }

      // ×・背景・Esc で閉じるときは、開いたときに積んだ履歴を戻す（popstate で閉じる）
      function closeLightbox() {
        if ($('lightbox').hidden) return;
        if (history.state && history.state.lightbox) history.back();
        else hideLightbox();
      }

      $('lightbox-close').addEventListener('click', closeLightbox);
      $('lightbox').addEventListener('click', function (e) {
        if (e.target === $('lightbox')) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });
      window.addEventListener('popstate', hideLightbox);

      // 一覧から記事を開く前にスクロール位置を覚えておく
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a');
        if (!a) return;
        if (isImageLink(a) && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
          e.preventDefault();
          openLightbox(a);
          return;
        }
        if (!$('list-view').hidden && /^#post-/.test(a.getAttribute('href') || '')) {
          listScrollY = window.scrollY;
        }
        // 記事の中にある同じブログの記事へのリンクは、このページ内で開く
        var target = byUrl[a.href.split(/[?#]/)[0]];
        if (target && a.closest('#post-body')) {
          e.preventDefault();
          location.hash = '#post-' + target.id;
        }
      });
      window.addEventListener('hashchange', function () {
        hideLightbox();
        route();
      });
      window.addEventListener('resize', function () {
        if (!$('list-view').hidden) updateMoreLinks();
      });

      Promise.all([fetchAllSummaries(1, []), fetchLatestFull()]).then(function (results) {
        // 2つのフィードを取る間に投稿があっても漏れないよう、両方の記事をまとめる
        results[0].concat(results[1]).forEach(function (entry) {
          var p = toPost(entry);
          if (!byId[p.id]) {
            byId[p.id] = p;
            posts.push(p);
          }
        });
        results[1].forEach(function (entry) {
          setBody(byId[entry.id.$t.split('post-').pop()], entry);
        });
        posts.sort(function (a, b) {
          return b.time - a.time;
        });
        posts.forEach(function (p) {
          byUrl[p.url.split(/[?#]/)[0]] = p;
        });
        $('status').hidden = true;
        if (!posts.length) {
          $('status').hidden = false;
          $('status').textContent = 'まだ記事がありません';
          return;
        }
        renderList();
        route();
      }).catch(function () {
        var status = $('status');
        status.textContent = '記事を読み込めませんでした。';
        status.appendChild(el('a', { href: BLOG_URL, textContent: 'ブログを直接開く' }));
      });
    })();
  </script>
</body>
</html>
