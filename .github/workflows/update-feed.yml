name: Update blog feed
on:
  # Blogger の更新を1時間ごとに確認して docs/feed.xml を作り直す
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/build_feed.py
      - .github/workflows/update-feed.yml

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build feed
        run: python3 scripts/build_feed.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/feed.xml && git ls-files --error-unmatch docs/feed.xml >/dev/null 2>&1; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git commit -m "Update blog feed"
          git push
